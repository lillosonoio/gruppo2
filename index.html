<body>
<meta charset="utf-8">
<title>KINÈ Oggi</title>
<style>
/* Layout: app shell — barra laterale comprimibile + area di lavoro fluida (planner | Tocca a te), che si impila sotto i 1080px */
:root {
  color-scheme: light;
  --violet: #6D28D9; --violet-ink: #4C1D95; --violet-mid: #7C3AED; --lavender: #A78BFA; --lilac: #C4B5FD;
  --night: #1E1B2E;
  --bg: #F7F6FC; --surface: #FFFFFF; --tint: #F2EEFD; --tint2: #EDE9FE; --tint-ai: #F5F1FF; --soft: #FAF8FF;
  --line: #E7E1FB; --line-soft: #F0EDFA; --line-mid: #DDD6FE;
  --ink: #26252B; --ink2: #4A4955; --muted: #6B6A75; --faint: #9A98A8;
  --ok: #15803D; --ok-bg: #ECFDF3; --ok-line: #BBE5C8;
  --warn: #B45309; --warn-bg: #FEF3C7; --warn-line: #FCD9A0; --warn-dot: #F59E0B;
  --miss: #B4544A; --miss-bg: #FFF3F1; --miss-line: #F6D0CA;
  --font: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
* { box-sizing: border-box; }
button, input, textarea { font-family: inherit; }
button { color: inherit; }
:focus-visible { outline: 2px solid var(--violet-mid); outline-offset: 2px; }
@keyframes kin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes kpulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes kglow { 0% { box-shadow: 0 0 0 0 rgba(124,58,237,.35); } 100% { box-shadow: 0 0 0 8px rgba(124,58,237,0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.app { display: flex; height: 100%; }

/* ---------- barra laterale ---------- */
.side { flex-shrink: 0; width: 220px; background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 18px; transition: width .25s, padding .25s; overflow: hidden; }
.app.collapsed .side { width: 76px; padding: 24px 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.logo { width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: var(--violet); display: grid; place-items: center; }
.brand-txt { display: flex; flex-direction: column; white-space: nowrap; }
.brand-txt b { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.brand-txt span { font-size: 12px; color: var(--muted); }
.nav-group { display: flex; flex-direction: column; gap: 4px; }
.nav-gl { font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #A8A3B8; padding: 0 12px 2px; white-space: nowrap; }
.nav-group.nav-ia { margin-top: auto; }
.app.collapsed .nav-gl { font-size: 0; height: 1px; padding: 0; margin: 0 10px 4px; background: #EFEBFA; }
.app.collapsed .nav-group:first-of-type .nav-gl { display: none; }
.nav-sep { height: 1px; background: #EFEBFA; margin: 0 8px; }
.nav-btn { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: var(--ink2); font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; position: relative; white-space: nowrap; }
.nav-btn.sub { height: 38px; font-size: 14px; }
.nav-btn:hover { background: var(--soft); }
.nav-btn.on { background: var(--tint); color: var(--violet-ink); font-weight: 600; }
.nav-btn.soon { color: #C2BFCE; cursor: not-allowed; }
.nav-btn.soon:hover { background: transparent; }
.nav-btn .soon-tag { flex-grow: 0; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #F4F3F8; color: #A9A6B8; }
.nav-btn svg { flex-shrink: 0; }
.nav-btn .lbl { flex-grow: 1; }
.badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--violet); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.nav-toggle { color: var(--muted); font-size: 13px; }
.app.collapsed .side .brand-txt, .app.collapsed .side .lbl, .app.collapsed .side .badge.full { display: none; }
.app.collapsed .nav-btn { justify-content: center; padding: 0; }
.badge.mini { display: none; position: absolute; top: 5px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px; font-size: 10px; border: 2px solid var(--surface); }
.app.collapsed .badge.mini { display: grid; }
.nav-toggle svg { transition: transform .25s; }
.app.collapsed .nav-toggle svg { transform: scaleX(-1); }

/* ---------- area principale ---------- */
.main { flex-grow: 1; min-width: 0; overflow-y: auto; padding-block: 28px 40px; padding-left: max(clamp(16px, 3vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 3vw, 40px), env(safe-area-inset-right, 0px)); position: relative; }
.wrap { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.hello { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; }
.hello h1 { margin: 0; font-size: clamp(24px, 2.4vw, 30px); font-weight: 600; text-wrap: balance; }
.hello .date { font-size: 14px; font-weight: 600; letter-spacing: .5px; color: var(--violet); white-space: nowrap; }

.dash { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.dash-head { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; width: 100%; border: none; background: transparent; text-align: left; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted); }
.eyebrow.v { color: var(--violet); }
.chips { flex-grow: 1; min-width: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.chip.v { background: var(--tint); border-color: var(--tint); color: var(--violet-ink); }
.chip.ok { background: var(--ok-bg); border-color: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); border-color: var(--warn-bg); color: var(--warn); }
.chev { width: 32px; height: 32px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--violet-ink); display: grid; place-items: center; cursor: pointer; }
.chev svg { transition: transform .25s; }
.chev.open svg { transform: rotate(180deg); }
.dash-body { border-top: 1px solid var(--line-soft); padding: 14px 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; animation: kin .25s; }
.tile { background: var(--soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.tile .num { font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .row { display: flex; align-items: baseline; gap: 8px; }
.tile .unit { font-size: 13px; color: var(--ink2); }
.tile .parts { display: flex; flex-wrap: wrap; gap: 5px; }
.tile .parts .chip { font-size: 11.5px; padding: 2px 8px; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: 24px; align-items: start; }
@media (max-width: 1080px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link { border: none; background: transparent; padding: 0; color: var(--violet); font-size: 12px; font-weight: 600; cursor: pointer; }

/* ---------- proposta IA ---------- */
.ai { border-radius: 16px; padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; animation: kin .3s; }
.ai.prop { background: linear-gradient(135deg, var(--tint-ai), var(--tint2)); border: 1px dashed var(--lavender); }
.ai.wait { background: #FFFBEB; border: 1px solid var(--warn-line); }
.ai.done { background: var(--ok-bg); border: 1px solid var(--ok-line); }
.ai-ico { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; color: #fff; }
.ai.prop .ai-ico { background: var(--violet); } .ai.wait .ai-ico { background: var(--warn-dot); } .ai.done .ai-ico { background: var(--ok); }
.ai-body { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ai.prop .eyebrow { color: var(--violet); } .ai.wait .eyebrow { color: var(--warn); } .ai.done .eyebrow { color: var(--ok); }
.ai-title { font-size: 14.5px; font-weight: 600; line-height: 20px; }
.ai-text { font-size: 12.5px; line-height: 18px; color: var(--ink2); }
.quote { font-size: 12.5px; line-height: 17px; color: #3B2A6B; background: rgba(255,255,255,.7); border: 1px dashed var(--lavender); border-radius: 10px; padding: 7px 10px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 34px; padding: 0 14px; border-radius: 9px; font-size: 13px; cursor: pointer; border: 1px solid var(--line-mid); background: var(--surface); color: var(--violet-ink); white-space: nowrap; }
.btn.primary { border: none; background: var(--violet); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #5B21B6; }
.btn.big { height: 42px; padding: 0 20px; border-radius: 11px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.btn.soft { border: none; background: var(--tint); }
.btn.danger { border-color: var(--miss-line); color: var(--miss); }
.x { width: 30px; height: 30px; flex-shrink: 0; border: none; border-radius: 8px; background: transparent; font-size: 18px; cursor: pointer; color: var(--muted); }

/* ---------- planner ---------- */
.planner { display: flex; flex-direction: column; gap: 8px; }
.appt.past:not(:hover):not(.open) { opacity: .5; }
.appt.past .who b { font-weight: 500; }
.nowline { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; margin: -2px 0; }
.nowline span { font-size: 11.5px; font-weight: 700; color: #E5484D; text-align: right; font-variant-numeric: tabular-nums; }
.nowline i { position: relative; height: 2px; background: #E5484D; border-radius: 2px; }
.nowline i::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 999px; background: #E5484D; }
.prow { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: start; }
.hour { padding-top: 14px; font-size: 13px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
.hour.on { color: var(--violet-ink); }
.appt { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; transition: box-shadow .3s, opacity .2s; min-width: 0; }
.appt.next { border: 1.5px solid var(--lavender); box-shadow: 0 8px 24px rgba(109,40,217,.12); }
.appt.fresh { border: 1.5px dashed var(--lavender); }
.appt.ghosted { opacity: .4; }
.appt-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; flex-wrap: wrap; }
.handle { color: #C9C3DE; cursor: grab; font-size: 15px; letter-spacing: -3px; line-height: 1; padding: 6px 4px; touch-action: none; user-select: none; border-radius: 6px; }
.handle:hover { background: var(--soft); color: var(--lavender); }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
/* avatar dei pazienti tutti uguali: il colore resta alle etichette che hanno un significato */
.av { background: #F2EEFD !important; color: #4C1D95 !important; }
.who { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.who b { font-size: 15px; font-weight: 600; }
.who span { font-size: 12.5px; color: var(--muted); }
.tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.status { font-size: 12px; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
.appt-body { border-top: 1px solid var(--line-soft); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; animation: kin .25s; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.fact { background: var(--soft); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact span { font-size: 10.5px; font-weight: 600; letter-spacing: .5px; color: var(--muted); }
.fact b { font-size: 13px; font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 720px) { .two { grid-template-columns: minmax(0, 1fr); } }
.refs { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ref { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; line-height: 17px; flex-wrap: wrap; }
.ref b { font-weight: 600; }
.ref span { color: var(--muted); }
.reading { font-size: 12px; color: var(--warn); animation: kpulse 1.2s infinite; }
.knows { background: var(--tint-ai); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.knows .eyebrow { color: var(--violet); }
.bul { display: flex; gap: 7px; font-size: 12.5px; line-height: 17px; color: #3B2A6B; }
.bul::before { content: "•"; color: var(--lavender); }
.act { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.act .note { font-size: 12.5px; color: var(--muted); }
.rec { width: 9px; height: 9px; border-radius: 50%; background: #FCA5A5; }
.lunch { height: 46px; border-radius: 14px; background: repeating-linear-gradient(135deg, #F4F3F8 0 10px, #EEECF4 10px 20px); display: flex; align-items: center; padding: 0 16px; font-size: 13px; color: #8C8A99; }
.free { height: 56px; border-radius: 14px; border: 1.5px dashed #D6D2E8; background: transparent; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all .2s; width: 100%; }
.free:hover { border-color: var(--lavender); background: var(--soft); }
.free .plus { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--violet); }
.free .t { font-size: 12.5px; color: var(--faint); }
.free .t-drop { display: none; }
body.dragging .free:not(.pending) { border: 2px dashed var(--violet-mid); background: var(--tint-ai); }
body.dragging .free:not(.pending) .plus { background: var(--violet-mid); color: #fff; }
body.dragging .free:not(.pending) .t-idle { display: none; }
body.dragging .free:not(.pending) .t-drop { display: inline; color: var(--violet); font-weight: 600; }
body.dragging .free.over { background: var(--tint2); transform: scale(1.01); }
.free.pending { border: 1.5px dashed var(--warn-dot); background: #FFFBEB; cursor: default; }
.free.pending .plus { background: var(--warn-bg); color: var(--warn); }
.free.pending .t { color: var(--warn); font-weight: 600; }
.ghost { position: fixed; z-index: 100; pointer-events: none; opacity: .92; box-shadow: 0 18px 40px rgba(30,27,46,.22); transform: rotate(-1deg); }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }

/* ---------- prenotazione (app di Marta) ---------- */
.bk-screen { background: var(--bg); }
/* contenuti dei telefoni un po’ più piccoli, come su uno schermo vero */
.screen > .scr, .screen > .bk-s0 { zoom: .86; }
.bk-s0 { flex: 1; min-height: 0; overflow: auto; position: relative; display: flex; flex-direction: column; animation: kin .25s; }
.bk-search { position: absolute; left: 12px; right: 12px; top: 8px; z-index: 4; height: 42px; background: #fff; border-radius: 14px; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-shadow: 0 6px 18px rgba(30,27,46,.14); color: var(--violet); }
.bk-search input { flex: 1; min-width: 0; border: none; outline: none; font-size: 13.5px; font-family: inherit; color: var(--ink); background: transparent; }
.bk-cats { position: absolute; left: 0; right: 0; top: 56px; z-index: 4; display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 4px; scrollbar-width: none; }
.bk-cat { flex-shrink: 0; height: 30px; padding: 0 12px; border: none; border-radius: 999px; background: #fff; color: var(--ink2); font-size: 12px; font-family: inherit; box-shadow: 0 3px 10px rgba(30,27,46,.10); cursor: pointer; }
.bk-cat.on { background: var(--violet); color: #fff; font-weight: 600; }
.bk-map { position: relative; height: 330px; flex-shrink: 0; overflow: hidden; }
.bk-mapsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bk-lbl { position: absolute; font-size: 9.5px; letter-spacing: .5px; color: #8E89A6; text-transform: uppercase; pointer-events: none; }
.bk-me { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 999px; background: #2563EB; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(37,99,235,.45); z-index: 2; }
.bk-me i { position: absolute; inset: -14px; border-radius: 999px; background: rgba(37,99,235,.18); animation: bkPulse 2s infinite; }
@keyframes bkPulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.bk-pin { position: absolute; transform: translate(-50%, -100%); z-index: 3; height: 26px; padding: 0 9px; border: none; border-radius: 999px; background: #fff; color: var(--ink); font-size: 11px; font-weight: 600; font-family: inherit; white-space: nowrap; box-shadow: 0 4px 12px rgba(30,27,46,.18); cursor: pointer; transition: transform .15s; }
.bk-pin::after { content: ''; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-top-color: #fff; border-bottom: 0; }
.bk-pin.on { background: var(--violet); color: #fff; transform: translate(-50%, -100%) scale(1.12); z-index: 5; }
.bk-pin.on::after { border-top-color: var(--violet); }
.bk-sheet { position: relative; margin-top: -18px; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px 14px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -6px 18px rgba(30,27,46,.08); z-index: 4; }
.bk-grab { width: 38px; height: 4px; border-radius: 999px; background: #D6D2E8; align-self: center; }
.bk-sheet-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bk-sheet-h b { font-size: 15px; font-weight: 600; }
.bk-sheet-h span { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.bk-filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.bk-f { flex-shrink: 0; height: 28px; padding: 0 10px; border: 1.5px solid var(--line-mid); border-radius: 999px; background: #fff; font-size: 11.5px; font-family: inherit; color: var(--ink2); cursor: pointer; }
.bk-f.on { border-color: var(--violet); background: var(--tint); color: var(--violet-ink); font-weight: 600; }
.bk-row { display: flex; gap: 10px; align-items: center; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; font-family: inherit; text-align: left; cursor: pointer; }
.bk-row.on { border-color: var(--violet); box-shadow: 0 0 0 2px var(--tint2); }
.bk-av { border-radius: 999px; display: grid; place-items: center; color: #fff; font-weight: 600; flex-shrink: 0; }
.bk-rt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.bk-rt b { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.bk-rt small { font-size: 11px; color: var(--muted); }
.bk-rt .star { font-style: normal; color: #B45309; font-weight: 600; }
.bk-kine { color: var(--violet) !important; font-weight: 600; }
.bk-slot { font-size: 10.5px; color: var(--muted); text-align: right; line-height: 1.3; white-space: nowrap; }
.bk-slot b { color: var(--ok); font-size: 11px; }
.scr.bk-prof { padding: 0 0 16px; gap: 12px; }
.bk-prof > .ph-card, .bk-prof > .bk-stats { margin: 0 14px; }
.bk-cover { position: relative; height: 120px; flex-shrink: 0; }
.bk-back { position: absolute; left: 12px; top: 10px; width: 34px; height: 34px; border: none; border-radius: 999px; background: rgba(255,255,255,.85); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; }
.bk-photo { position: absolute; left: 18px; bottom: -36px; width: 84px; height: 84px; border-radius: 999px; border: 4px solid var(--bg); background: var(--bg); }
.bk-pid { padding: 40px 14px 0; display: flex; flex-direction: column; gap: 4px; }
.bk-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.bk-badges span { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); }
.bk-badges span.v { background: var(--tint); color: var(--violet-ink); }
.bk-stats { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; }
.bk-stats div { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
.bk-stats div + div { border-left: 1px solid var(--line); }
.bk-stats b { font-size: 15px; font-weight: 600; }
.bk-stats span { font-size: 10.5px; color: var(--muted); }
.bk-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.bk-chips span, .bk-chips button { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); color: var(--ink2); font-family: inherit; }
.bk-chips span.on { background: var(--tint); border-color: var(--tint2); color: var(--violet-ink); font-weight: 600; }
.bk-chips.sel button { cursor: pointer; height: 32px; }
.bk-chips.sel button.on { background: var(--violet); border-color: var(--violet); color: #fff; font-weight: 600; }
.bk-cert { font-size: 12.5px; }
.bk-rev { font-size: 12.5px; line-height: 1.45; font-style: italic; }
.bk-rev small { font-style: normal; color: var(--muted); }
.bk-sticky { position: sticky; bottom: 0; margin: 0 14px; padding-top: 8px; background: linear-gradient(transparent, var(--bg) 30%); }
.bk-back2 { align-self: flex-start; border: none; background: transparent; color: var(--violet); font-size: 13px; font-family: inherit; cursor: pointer; padding: 0; }
.bk-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.bk-day { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 8px 0; border: 1.5px solid var(--line-mid); border-radius: 12px; background: #fff; font-family: inherit; cursor: pointer; }
.bk-day small { font-size: 10.5px; color: var(--muted); text-transform: uppercase; }
.bk-day b { font-size: 18px; font-weight: 600; }
.bk-day.on { border-color: var(--violet); background: var(--violet); }
.bk-day.on small, .bk-day.on b { color: #fff; }
.bk-times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bk-time { height: 42px; border: 1.5px solid var(--line-mid); border-radius: 12px; background: #fff; font-size: 14px; font-weight: 600; font-family: inherit; color: var(--violet-ink); cursor: pointer; }
.bk-time.on { background: var(--violet); border-color: var(--violet); color: #fff; }
.bk-fl { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--ink2); }
.bk-fl > span { font-weight: 600; }
.bk-fl textarea, .bk-fl input:not([type]) { border: 1.5px solid var(--line-mid); border-radius: 12px; padding: 9px 11px; font-size: 13px; font-family: inherit; color: var(--ink); background: #fff; resize: none; }
.bk-fl input[type="range"] { accent-color: var(--violet); }
.bk-fill { align-self: flex-start; font-size: 12px; }

/* ---------- vetrina ---------- */
.vt-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.vt-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vt-kpi b { font-size: 24px; font-weight: 600; line-height: 1.15; }
.vt-kpi > span:last-child { font-size: 12px; color: var(--muted); }
.vt-switch { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 6px; }
.vt-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.vt-switch i { width: 40px; height: 22px; border-radius: 999px; background: #D6D2E8; position: relative; transition: background .15s; flex-shrink: 0; }
.vt-switch i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: transform .15s; }
.vt-switch input:checked + i { background: var(--ok); }
.vt-switch input:checked + i::after { transform: translateX(18px); }
.vt-switch b { font-size: 13px; font-weight: 600; }
.vt-switch input:focus-visible + i { outline: 2px solid var(--violet); outline-offset: 2px; }
.vt-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.vt-left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.vt-right { position: sticky; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vt-prevbar { display: flex; gap: 6px; }
.phone.vt-phone { height: min(calc(100vh - 200px), 660px); }
.vt-prevnote { font-size: 12px; color: var(--muted); text-align: center; }
.vt-comp { display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.vt-ring { --p: 50; width: 64px; height: 64px; border-radius: 999px; background: conic-gradient(var(--violet) calc(var(--p) * 1%), #EDE9FE 0); display: grid; place-items: center; flex-shrink: 0; }
.vt-ring b { width: 50px; height: 50px; border-radius: 999px; background: var(--surface); display: grid; place-items: center; font-size: 14px; font-weight: 600; color: var(--violet-ink); }
.vt-cs { display: block; font-size: 12.5px; color: var(--muted); }
.vt-todo { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
.vt-todo .link { font-size: 12.5px; }
.vt-body { display: flex; flex-direction: column; gap: 14px; }
.vt-sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.vt-sh { display: flex; justify-content: space-between; align-items: center; }
.vt-cnt { font-size: 12px; color: var(--muted); }
.vt-sec textarea { border: 1.5px solid var(--line-mid); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.5; font-family: inherit; color: var(--ink); resize: vertical; width: 100%; box-sizing: border-box; }
.vt-me { display: flex; align-items: center; gap: 14px; }
.vt-me div { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.vt-me b { font-size: 16px; font-weight: 600; }
.vt-me span { font-size: 13px; color: var(--muted); }
.vt-ai { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vt-ai .eyebrow { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; }
.vt-busy { font-size: 13px; color: var(--violet); animation: blink 1s infinite; }
.vt-terms { gap: 4px !important; }
.vt-terms .eyebrow { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.vt-term { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; }
.vt-tq { font-weight: 600; }
.vt-tn { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vt-tok { font-size: 12.5px; color: var(--ok); font-weight: 600; justify-self: end; }
.vt-term .btn { justify-self: end; }
.vt-cert { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; flex-wrap: wrap; }
.vt-cert b { font-weight: 500; flex: 1; min-width: 160px; }
.vt-ok { font-size: 12px; color: var(--ok); font-weight: 600; }
.vt-wait { font-size: 12px; color: var(--warn); font-weight: 600; }
.vt-svc { display: grid; grid-template-columns: minmax(0, 1fr) 80px 110px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; }

.vt-svc > span { font-size: 12.5px; color: var(--muted); }

.vt-price input { width: 70px; height: 34px; border: 1.5px solid var(--line-mid); border-radius: 9px; padding: 0 8px; font-size: 14px; font-family: inherit; text-align: right; color: var(--ink); }
.vt-tog { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }

.vt-tog span { display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.vt-tog small { font-size: 12px; color: var(--muted); }
.vt-fl { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink2); }
.vt-fl > span { font-weight: 600; }
.vt-fl input { height: 38px; border: 1.5px solid var(--line-mid); border-radius: 10px; padding: 0 12px; font-size: 14px; font-family: inherit; color: var(--ink); }

.vt-addph { width: 96px; height: 72px; border-radius: 10px; border: 1.5px dashed var(--line-mid); background: transparent; color: var(--violet); font-family: inherit; font-size: 12.5px; cursor: pointer; }
.vt-rev { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.vt-rh { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; }
.vt-rh span:not(.vt-stars) { font-size: 12px; color: var(--muted); }
.vt-stars { margin-left: auto; color: #F59E0B; letter-spacing: 1px; }
.vt-stars i { font-style: normal; color: #E5E2EE; }
.vt-rt { font-size: 13.5px; line-height: 1.45; }
.vt-rr { font-size: 12.5px; color: #3B2A6B; background: var(--tint-ai); border-radius: 10px; padding: 8px 10px; }
.vt-rev textarea { border: 1.5px solid var(--lavender); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-family: inherit; resize: vertical; }
.vt-rev .link { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 12.5px; }
.bk-svc { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.bk-svc b { font-weight: 600; white-space: nowrap; }
.bk-reply { display: block; margin-top: 3px; font-style: normal; color: #3B2A6B !important; }
.bk-photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.bk-photos i { height: 42px; border-radius: 6px; }
@media (max-width: 1180px) { .vt-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .vt-grid { grid-template-columns: minmax(0, 1fr); } .vt-right { position: static; } }
@media (max-width: 640px) { .vt-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vt-term { grid-template-columns: minmax(0, 1fr) auto; } .vt-tn { display: none; } .vt-svc { grid-template-columns: minmax(0, 1fr) 110px; } .vt-svc > span { display: none; } }

/* ---------- libreria (stile Spotify) ---------- */
.lb-grid { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; }
.lb-rail { position: sticky; top: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 140px); overflow-y: auto; }
.lb-rail > .eyebrow { padding: 4px 8px 6px; }
.lb-ri { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; border-radius: 10px; padding: 7px 8px; font-family: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer; text-align: left; }
.lb-ri > span:last-child:not(.lb-pn) { margin-left: auto; font-size: 12px; color: var(--muted); }
.lb-ri:hover { background: var(--soft); }

.lb-pn { display: flex; flex-direction: column; min-width: 0; }
.lb-pn b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-pn small { font-size: 11.5px; color: var(--muted); }
.lb-new { display: flex; align-items: center; gap: 8px; border: 1.5px dashed var(--line-mid); background: transparent; border-radius: 10px; padding: 9px 10px; margin-top: 6px; font-family: inherit; font-size: 13px; color: var(--violet); cursor: pointer; }
.lb-new:hover { border-color: var(--violet-mid); background: var(--tint-ai); }
.lb-tip { margin-top: 10px; font-size: 12px; line-height: 1.45; color: #3B2A6B; background: var(--tint-ai); border-radius: 10px; padding: 9px 10px; }
.lb-cover { width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; overflow: hidden; color: #fff; }
.lb-cover.big { width: 170px; height: 170px; border-radius: 14px; box-shadow: 0 16px 36px rgba(30,27,46,.22); }
.lb-mosaic { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; }
.lb-mosaic .lb-fig { width: 100%; height: 100%; }
.lb-cover .lb-fig.mini { color: rgba(255,255,255,.92); }
.lb-main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.lb-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.lb-search { flex: 1; min-width: 220px; max-width: 520px; height: 40px; background: var(--surface); }
.lb-sort { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.lb-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.lb-sec { display: flex; flex-direction: column; gap: 10px; }
.lb-sh { display: flex; align-items: center; justify-content: space-between; }
.lb-sh .eyebrow { display: inline-flex; align-items: center; gap: 6px; }
.lb-shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 168px; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; }
.lb-card { scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: box-shadow .15s, transform .15s; }
.lb-card:hover { box-shadow: 0 10px 24px rgba(30,27,46,.10); transform: translateY(-2px); }
.lb-card.sel, .lb-row.sel { box-shadow: 0 0 0 2px var(--violet); }
.lb-art { position: relative; height: 110px; border-radius: 10px; background: linear-gradient(160deg, #2A2245, #1E1B2E); color: #C4B5FD; display: grid; place-items: center; margin-bottom: 6px; }
.lb-art .lb-fig { width: 76px; height: 76px; }
.lb-card b { font-size: 13px; font-weight: 600; line-height: 1.25; }
.lb-card > span { font-size: 11.5px; color: var(--muted); }
.lb-n { color: var(--violet-ink) !important; font-weight: 600; }
.lb-n i, .lb-c i { font-style: normal; color: var(--ok); }
.lb-ql { position: absolute; left: 8px; bottom: 8px; height: 26px; padding: 0 9px; border: none; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--violet-ink); font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
.lb-card:hover .lb-ql, .lb-card.sel .lb-ql, .lb-ql:focus-visible { opacity: 1; transform: none; }
.lb-heart { width: 30px; height: 30px; border: none; border-radius: 999px; background: transparent; color: #A8A3B8; font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; transition: transform .12s, color .12s; }
.lb-heart:hover { transform: scale(1.12); color: var(--violet); }
.lb-heart.on { color: var(--violet); }
.lb-art .lb-heart { position: absolute; right: 6px; top: 6px; background: rgba(255,255,255,.12); color: #E9E5FB; }
.lb-art .lb-heart.on { color: #F0ABFC; }
.lb-sugg { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.lb-sg { display: flex; gap: 14px; background: var(--tint-ai); border: 1px dashed var(--lavender); border-radius: 14px; padding: 12px; }
.lb-sg .lb-cover { width: 84px; height: 84px; border-radius: 10px; }
.lb-sgt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lb-sgt b { font-size: 14px; font-weight: 600; }
.lb-sgt span { font-size: 12px; color: var(--ink2); }
.lb-sgt small { font-size: 12px; color: #3B2A6B; }
.lb-gap { font-size: 12px; color: var(--warn); }
.lb-listtitle { display: flex; align-items: baseline; gap: 12px; }

.lb-listtitle span { font-size: 13px; color: var(--muted); }
.lb-list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.lb-lh, .lb-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 100px 120px 34px 34px 34px; gap: 8px; align-items: center; padding: 0 12px; }
.lb-lh { height: 36px; font-size: 10.5px; font-weight: 600; letter-spacing: 1px; color: var(--muted); border-bottom: 1px solid var(--line); }
.lb-row { min-height: 56px; border-top: 1px solid var(--line-soft); cursor: pointer; }
.lb-row:first-of-type { border-top: none; }
.lb-row:hover { background: var(--soft); }
.lb-i { font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.lb-tt { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lb-tt b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-tt span { font-size: 12px; color: var(--muted); }
.lb-thumb { width: 40px; height: 40px; border-radius: 8px; background: #1E1B2E; color: #C4B5FD; display: grid; place-items: center; flex-shrink: 0; }
.lb-thumb .lb-fig { width: 32px; height: 32px; }
.lb-d { font-size: 12.5px; color: var(--ink2); }
.lb-c { font-size: 12.5px; color: var(--muted); }
.lb-c b { color: var(--ink); font-weight: 600; }
.lb-ic { width: 32px; height: 32px; border: none; border-radius: 8px; background: transparent; color: var(--violet-ink); cursor: pointer; display: grid; place-items: center; font-size: 18px; }
.lb-ic:hover { background: var(--tint); }
.lb-plhead { display: flex; gap: 22px; align-items: flex-end; padding: 6px 0 4px; }
.lb-plt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lb-plt h2 { margin: 0; font-size: clamp(26px, 3vw, 40px); font-weight: 700; line-height: 1.1; }
.lb-plt > span { font-size: 13px; color: var(--muted); }
.lb-play { width: 52px; height: 52px; border: none; border-radius: 999px; background: var(--violet); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 24px rgba(109,40,217,.35); transition: transform .12s; }
.lb-play svg path { fill: #fff; }
.lb-play:hover { transform: scale(1.06); }
.lb-playl { font-size: 13.5px; font-weight: 600; color: var(--violet-ink); align-self: center; }
.lb-add { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

.lb-addrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line-soft); }
.lb-addrow b { display: block; font-size: 13.5px; font-weight: 600; }
.lb-addrow span { font-size: 12px; color: var(--muted); }
.modal.lb-qlm { width: min(760px, 100%); padding: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); overflow: hidden; gap: 0; }
.lb-stage { position: relative; background: radial-gradient(ellipse at 50% 40%, #2A2245, #120F1E 80%); color: #C4B5FD; display: grid; place-items: center; min-height: 320px; }
.lb-stage .lb-fig { width: 210px; height: 210px; }
.lb-loop { position: absolute; left: 12px; top: 12px; font-size: 11px; color: #D9D4F5; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px 9px; }
.lb-qlb { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.lb-qlb .mhead { align-items: flex-start; }
.lb-qlb .lb-heart { font-size: 22px; width: 36px; height: 36px; }
.lb-kv { display: flex; flex-direction: column; gap: 3px; }
.lb-kv span { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.lb-kv b { font-size: 14px; font-weight: 500; line-height: 1.45; }
.lb-keys { margin-top: auto; font-size: 11.5px; color: var(--muted); }
.lb-keys kbd { font-family: inherit; font-size: 11px; background: var(--soft); border: 1px solid var(--line-mid); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin: 0 1px; }
.lb-fig .arm { transform-box: view-box; transform-origin: 20px 14px; }
.lb-fig .body { transform-box: view-box; }
.lb-fig.an-raise .arm { animation: lbRaise 3.2s ease-in-out infinite; }
.lb-fig.an-swing .arm { animation: lbSwing 1.8s ease-in-out infinite; }
.lb-fig.an-rot .arm { animation: lbRot 2.4s ease-in-out infinite; }
.lb-fig.an-hold .arm { animation: lbHold 2.6s ease-in-out infinite; }

    B.hr += (B.hrT - B.hr) * 0.012 + (Math.random() - 0.5) * 0.25;
    if (now - B.lastPush > 180) { B.lastPush = now; B.hist.push(B.hr); if (B.hist.length > 60) B.hist.shift(); B.hrSum += B.hr; B.hrN++; if (B.hr > B.hrPk) B.hrPk = B.hr; }
    if (now - B.lastDom > 220) { B.lastDom = now; bioDom(); }
  }
  function bioDom() {
    var B = OC.bio, g = function (id) { return document.getElementById(id); };
    if (!B || !g('bioHr')) return;
    g('bioHr').textContent = Math.round(B.hr);
    g('bioEl').textContent = Math.round(B.el) + '°';
    g('bioMax').textContent = B.elMax ? Math.round(B.elMax) + '°' : '—';
    g('bioUp').textContent = B.ups.length ? (B.ups[B.ups.length - 1]).toFixed(1).replace('.', ',') + ' s' : '—';
    var cv = g('bioSpark'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    if (B.hist.length < 2) return;
    var lo = 80, hi = 112;
    ctx.strokeStyle = '#FCA5A5'; ctx.lineWidth = 1.6; ctx.beginPath();
    B.hist.forEach(function (v, i) { var x = W - (B.hist.length - 1 - i) * (W / 59), y = H - 2 - (v - lo) / (hi - lo) * (H - 4); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
    ctx.stroke();
  }
  function bioSummary() {
    var B = OC.bio || {};
    var avg = B.hrN ? Math.round(B.hrSum / B.hrN) : 96, pk = B.hrPk ? Math.round(B.hrPk) : 104;
    var mx = B.elMax ? Math.round(B.elMax) : 132;
    var up = B.ups && B.ups.length ? B.ups.reduce(function (s, x) { return s + x; }, 0) / B.ups.length : 2.8;
    return { avg: avg, pk: pk, max: Math.min(mx, 175), up: up.toFixed(1).replace('.', ',') };
  }
  function occRep() { OC.up = false; OC.reps++; }
  function occHud() {
    var al = document.getElementById('occAlert'), gd = document.getElementById('occGood'), tip = document.getElementById('occTip');
    if (!al) return;
    al.hidden = !OC.err; tip.hidden = OC.err;
    gd.hidden = OC.err || !OC.hadErr;
  }
  var MIC = '<span class="occ-mic"><i></i><i></i><i></i><i></i><i></i></span>';
  function occVoice() {
    if (OC.phase !== 'ex' || S.screen !== 'occhiali') return;
    OC.phase = 'voice'; OC.forceErr = false; OC.err = false; OC.hadErr = false; occHud();
    var rf = document.getElementById('occRef'); if (rf) rf.classList.add('dim');
    var vb = document.getElementById('occVoice'); if (!vb) return;
    vb.hidden = false;
    var tp = document.getElementById('occTip'); if (tp) tp.style.display = 'none';
    vb.innerHTML = '<span class="occ-q">Bravissima, per oggi hai terminato! Com’è andata? Dimmi il dolore da 0 a 5 e un feedback da inviare a Luca.</span>' + MIC;
  }
  function occAnswer() {
    if (S.screen !== 'occhiali') return;
    if (OC.phase === 'ex') occVoice();
    var vb = document.getElementById('occVoice'); if (!vb) return;
    OC.phase = 'answer';
    vb.innerHTML = '<span class="occ-q">Ho capito:</span><span class="occ-a">Dolore <b>2 su 5</b> · «al muro tira un po’»</span><span class="occ-q" style="font-size:16px">Vuoi inviare il feedback a Luca?</span><button class="btn primary" data-a="occSend" style="height:44px;font-size:15px">Sì, invia</button>';
  }
  var VLINES = {
    1: 'Luca ti ricorda: non alzare la spalla verso l’orecchio mentre sali.',
    2: 'Abbassa la spalla mentre sali.',
    3: 'Così va bene.',
    4: 'Bravissima, per oggi hai terminato! Com’è andata? Dimmi il dolore da zero a cinque e un feedback da inviare a Luca.',
    5: 'Vuoi inviare il feedback a Luca?',
    6: 'Inviato a Luca. A domani, Marta!'
  };
  Object.assign(A, {
    occOpen: function () { occStart(); },
    occClose: function () { if (OC.studio) { lvTwinEnd(); return; } occStop(); hush(); S.screen = 'paziente'; render(); },
    occSend: function () {
      var vb = document.getElementById('occVoice');
      if (vb) vb.innerHTML = '<span class="occ-a">✓ Inviato a Luca</span>';
      setTimeout(function () {
        S.bio = bioSummary(); occStop(); S.homeDone = true; addLog('Ricevuti i dati del sensore al polso', 'Marta Rinaldi · battito medio ' + S.bio.avg + ' bpm · elevazione max ' + S.bio.max + '°', 'auto', '18:43'); addLog('Ricevuta dagli occhiali la scheda a voce e aggiunta al programma', 'Marta Rinaldi · scivolamento al muro, dolore 2/5', 'auto', '18:42'); addLog('Corretto in tempo reale l’errore della spalla, poi esecuzione giusta', 'Marta Rinaldi · gemello digitale', 'auto', '18:39'); S.screen = 'paziente'; P.perc = 'spalla'; P.tab = 'v1'; P.sub = 'prog'; P.exOpen = {};
        render(); beep();
        toast('Marta ha appena finito: dolore 2/5 allo scivolamento al muro, «al muro tira un po’»');
        setTimeout(function () { var c = document.querySelector('.cell.newc'); if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 200);
      }, 1100);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input, textarea')) return;
    if (S.screen === 'paziente' && S.visited && e.key.toLowerCase() === 'm') { telOpen(); return; }
    if (S.screen === 'live' && e.key.toLowerCase() === 'b' && !LV.confirmExit) { LV.ver = LV.ver === 'A' ? 'B' : 'A'; LV.show = null; if (LV.ver === 'B') occWarm().catch(function () {}); renderLive(); return; }
    if (S.screen === 'live' && LV.show && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { A.lvShowGo({ dataset: { d: e.key === 'ArrowRight' ? 1 : -1 } }); return; }
    if (S.screen === 'live' && LV.show && e.key === 'Escape') { A.lvShowClose(); return; }
    if (S.screen === 'occhiali' && OC.studio && e.key === 'Escape') { lvTwinEnd(); return; }
    if ((S.screen === 'telefono' || S.screen === 'occhiali') && e.key.toLowerCase() === 'v') { A.voiceToggle(); return; }
    // voce a comando: tasti 1–6 (anche dal tastierino numerico)
    var n = /^[1-6]$/.test(e.key) ? +e.key : 0;
    if (n && S.screen === 'occhiali' && OC.studio && n > 3) { e.preventDefault(); return; }
    if (n && (S.screen === 'occhiali' || (n === 6 && S.homeDone))) {
      e.preventDefault();
      if (S.screen === 'occhiali') {
        if (n === 2 && OC.phase === 'ex') { OC.forceErr = true; OC.errFrames = 5; OC.err = true; OC.hadErr = true; occHud(); }
        if (n === 3 && OC.phase === 'ex') { OC.forceErr = false; OC.errFrames = 0; OC.err = false; occHud(); }
        if (n === 4) occVoice();
        if (n === 5) occAnswer();
      }
      say(VLINES[n]);
      return;
    }
    if (S.screen === 'telefono') {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (TF.step === 4) { telClear(); occStart(); } else telGo(TF.step + 1); }
      else if (e.key === 'ArrowLeft') telGo(TF.step - 1);
      else if (e.key.toLowerCase() === 'o') { telClear(); occStart(); }
      else if (e.key === 'Escape') A.telClose();
      return;
    }
    if (S.screen !== 'occhiali' || e.target.matches('input, textarea')) return;
    var k = e.key.toLowerCase();
    if (k === 'e') { OC.forceErr = !OC.forceErr; if (OC.forceErr) { OC.errFrames = 5; OC.err = true; OC.hadErr = true; } else { OC.errFrames = 0; OC.err = false; } occHud(); }
    if (k === 'f' && !OC.studio) occVoice();
    if (k === 's' && OC.mode !== 'sim') { OC.mode = 'sim'; occSim(OC.stream ? 'Webcam dal vivo · gemello simulato' : 'Simulazione', true); }
  });

  render();
})();
</script>
