<style>
/* Layout: app shell — barra laterale comprimibile + area di lavoro fluida (planner | Tocca a te), che si impila sotto i 1080px */
:root {
  color-scheme: light;
  --violet: #6D28D9; --violet-ink: #4C1D95; --violet-mid: #7C3AED; --lavender: #A78BFA; --lilac: #C4B5FD;
  --night: #1E1B2E;
  --bg: #F7F6FC; --surface: #FFFFFF; --tint: #F2EEFD; --tint2: #EDE9FE; --tint-ai: #F5F1FF; --soft: #FAF8FF;
  --line: #E7E1FB; --line-soft: #F0EDFA; --line-mid: #DDD6FE;
  --ink: #26252B; --ink2: #4A4955; --muted: #6B6A75; --faint: #9A98A8;
  --ok: #15803D; --ok-bg: #ECFDF3; --ok-line: #BBE5C8;
  --warn: #B45309; --warn-bg: #FEF3C7; --warn-line: #FCD9A0; --warn-dot: #F59E0B;
  --miss: #B4544A; --miss-bg: #FFF3F1; --miss-line: #F6D0CA;
  --font: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
* { box-sizing: border-box; }
button, input, textarea { font-family: inherit; }
button { color: inherit; }
:focus-visible { outline: 2px solid var(--violet-mid); outline-offset: 2px; }
@keyframes kin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes kpulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes kglow { 0% { box-shadow: 0 0 0 0 rgba(124,58,237,.35); } 100% { box-shadow: 0 0 0 8px rgba(124,58,237,0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.app { display: flex; height: 100%; }

/* ---------- barra laterale ---------- */
.side { flex-shrink: 0; width: 220px; background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 26px; transition: width .25s, padding .25s; overflow: hidden; }
.app.collapsed .side { width: 76px; padding: 24px 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.logo { width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: var(--violet); display: grid; place-items: center; }
.brand-txt { display: flex; flex-direction: column; white-space: nowrap; }
.brand-txt b { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.brand-txt span { font-size: 12px; color: var(--muted); }
.nav-group { display: flex; flex-direction: column; gap: 4px; }
.nav-sep { height: 1px; background: #EFEBFA; margin: 0 8px; }
.nav-btn { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: var(--ink2); font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; position: relative; white-space: nowrap; }
.nav-btn.sub { height: 38px; font-size: 14px; }
.nav-btn:hover { background: var(--soft); }
.nav-btn.on { background: var(--tint); color: var(--violet-ink); font-weight: 600; }
.nav-btn.soon { color: #C2BFCE; cursor: not-allowed; }
.nav-btn.soon:hover { background: transparent; }
.nav-btn .soon-tag { flex-grow: 0; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #F4F3F8; color: #A9A6B8; }
.nav-btn svg { flex-shrink: 0; }
.nav-btn .lbl { flex-grow: 1; }
.badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--violet); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.nav-toggle { margin-top: auto; color: var(--muted); font-size: 13px; }
.app.collapsed .side .brand-txt, .app.collapsed .side .lbl, .app.collapsed .side .badge.full { display: none; }
.app.collapsed .nav-btn { justify-content: center; padding: 0; }
.badge.mini { display: none; position: absolute; top: 5px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px; font-size: 10px; border: 2px solid var(--surface); }
.app.collapsed .badge.mini { display: grid; }
.nav-toggle svg { transition: transform .25s; }
.app.collapsed .nav-toggle svg { transform: scaleX(-1); }

/* ---------- area principale ---------- */
.main { flex-grow: 1; min-width: 0; overflow-y: auto; padding-block: 28px 40px; padding-left: max(clamp(16px, 3vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 3vw, 40px), env(safe-area-inset-right, 0px)); position: relative; }
.wrap { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.hello { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; }
.hello h1 { margin: 0; font-size: clamp(24px, 2.4vw, 30px); font-weight: 600; text-wrap: balance; }
.hello .date { font-size: 14px; font-weight: 600; letter-spacing: .5px; color: var(--violet); white-space: nowrap; }

.dash { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.dash-head { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; width: 100%; border: none; background: transparent; text-align: left; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted); }
.eyebrow.v { color: var(--violet); }
.chips { flex-grow: 1; min-width: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.chip.v { background: var(--tint); border-color: var(--tint); color: var(--violet-ink); }
.chip.ok { background: var(--ok-bg); border-color: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); border-color: var(--warn-bg); color: var(--warn); }
.chev { width: 32px; height: 32px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--violet-ink); display: grid; place-items: center; cursor: pointer; }
.chev svg { transition: transform .25s; }
.chev.open svg { transform: rotate(180deg); }
.dash-body { border-top: 1px solid var(--line-soft); padding: 14px 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; animation: kin .25s; }
.tile { background: var(--soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.tile .num { font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .row { display: flex; align-items: baseline; gap: 8px; }
.tile .unit { font-size: 13px; color: var(--ink2); }
.tile .parts { display: flex; flex-wrap: wrap; gap: 5px; }
.tile .parts .chip { font-size: 11.5px; padding: 2px 8px; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: 24px; align-items: start; }
@media (max-width: 1080px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link { border: none; background: transparent; padding: 0; color: var(--violet); font-size: 12px; font-weight: 600; cursor: pointer; }

/* ---------- proposta IA ---------- */
.ai { border-radius: 16px; padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; animation: kin .3s; }
.ai.prop { background: linear-gradient(135deg, var(--tint-ai), var(--tint2)); border: 1px dashed var(--lavender); }
.ai.wait { background: #FFFBEB; border: 1px solid var(--warn-line); }
.ai.done { background: var(--ok-bg); border: 1px solid var(--ok-line); }
.ai-ico { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; color: #fff; }
.ai.prop .ai-ico { background: var(--violet); } .ai.wait .ai-ico { background: var(--warn-dot); } .ai.done .ai-ico { background: var(--ok); }
.ai-body { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ai.prop .eyebrow { color: var(--violet); } .ai.wait .eyebrow { color: var(--warn); } .ai.done .eyebrow { color: var(--ok); }
.ai-title { font-size: 14.5px; font-weight: 600; line-height: 20px; }
.ai-text { font-size: 12.5px; line-height: 18px; color: var(--ink2); }
.quote { font-size: 12.5px; line-height: 17px; color: #3B2A6B; background: rgba(255,255,255,.7); border: 1px dashed var(--lavender); border-radius: 10px; padding: 7px 10px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 34px; padding: 0 14px; border-radius: 9px; font-size: 13px; cursor: pointer; border: 1px solid var(--line-mid); background: var(--surface); color: var(--violet-ink); white-space: nowrap; }
.btn.primary { border: none; background: var(--violet); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #5B21B6; }
.btn.big { height: 42px; padding: 0 20px; border-radius: 11px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.btn.soft { border: none; background: var(--tint); }
.btn.danger { border-color: var(--miss-line); color: var(--miss); }
.x { width: 30px; height: 30px; flex-shrink: 0; border: none; border-radius: 8px; background: transparent; font-size: 18px; cursor: pointer; color: var(--muted); }

/* ---------- planner ---------- */
.planner { display: flex; flex-direction: column; gap: 8px; }
.prow { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: start; }
.hour { padding-top: 14px; font-size: 13px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
.hour.on { color: var(--violet-ink); }
.appt { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; transition: box-shadow .3s, opacity .2s; min-width: 0; }
.appt.next { border: 1.5px solid var(--lavender); box-shadow: 0 8px 24px rgba(109,40,217,.12); }
.appt.fresh { border: 1.5px dashed var(--lavender); }
.appt.ghosted { opacity: .4; }
.appt-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; flex-wrap: wrap; }
.handle { color: #C9C3DE; cursor: grab; font-size: 15px; letter-spacing: -3px; line-height: 1; padding: 6px 4px; touch-action: none; user-select: none; border-radius: 6px; }
.handle:hover { background: var(--soft); color: var(--lavender); }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.who { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.who b { font-size: 15px; font-weight: 600; }
.who span { font-size: 12.5px; color: var(--muted); }
.tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.status { font-size: 12px; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
.appt-body { border-top: 1px solid var(--line-soft); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; animation: kin .25s; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.fact { background: var(--soft); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact span { font-size: 10.5px; font-weight: 600; letter-spacing: .5px; color: var(--muted); }
.fact b { font-size: 13px; font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 720px) { .two { grid-template-columns: minmax(0, 1fr); } }
.refs { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ref { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; line-height: 17px; flex-wrap: wrap; }
.ref b { font-weight: 600; }
.ref span { color: var(--muted); }
.reading { font-size: 12px; color: var(--warn); animation: kpulse 1.2s infinite; }
.knows { background: var(--tint-ai); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.knows .eyebrow { color: var(--violet); }
.bul { display: flex; gap: 7px; font-size: 12.5px; line-height: 17px; color: #3B2A6B; }
.bul::before { content: "•"; color: var(--lavender); }
.act { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.act .note { font-size: 12.5px; color: var(--muted); }
.rec { width: 9px; height: 9px; border-radius: 50%; background: #FCA5A5; }
.lunch { height: 46px; border-radius: 14px; background: repeating-linear-gradient(135deg, #F4F3F8 0 10px, #EEECF4 10px 20px); display: flex; align-items: center; padding: 0 16px; font-size: 13px; color: #8C8A99; }
.free { height: 56px; border-radius: 14px; border: 1.5px dashed #D6D2E8; background: transparent; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all .2s; width: 100%; }
.free:hover { border-color: var(--lavender); background: var(--soft); }
.free .plus { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--violet); }
.free .t { font-size: 12.5px; color: var(--faint); }
.free .t-drop { display: none; }
body.dragging .free:not(.pending) { border: 2px dashed var(--violet-mid); background: var(--tint-ai); }
body.dragging .free:not(.pending) .plus { background: var(--violet-mid); color: #fff; }
body.dragging .free:not(.pending) .t-idle { display: none; }
body.dragging .free:not(.pending) .t-drop { display: inline; color: var(--violet); font-weight: 600; }
body.dragging .free.over { background: var(--tint2); transform: scale(1.01); }
.free.pending { border: 1.5px dashed var(--warn-dot); background: #FFFBEB; cursor: default; }
.free.pending .plus { background: var(--warn-bg); color: var(--warn); }
.free.pending .t { color: var(--warn); font-weight: 600; }
.ghost { position: fixed; z-index: 100; pointer-events: none; opacity: .92; box-shadow: 0 18px 40px rgba(30,27,46,.22); transform: rotate(-1deg); }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }

/* ---------- tocca a te ---------- */
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; }
.kcard.risk { border-color: var(--warn-line); }
.khead { display: flex; align-items: center; gap: 10px; }
.khead .av { width: 32px; height: 32px; font-size: 12px; }
.khead .who b { font-size: 13.5px; }
.khead .who span { font-size: 11px; }
.kind { font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.ktitle { font-size: 14px; font-weight: 600; line-height: 19px; }
.ktext { font-size: 12.5px; line-height: 17px; color: var(--ink2); }
.said { font-size: 12.5px; line-height: 17px; background: #F4F3F8; border-radius: 10px; padding: 7px 10px; }
.draft { font-size: 12.5px; line-height: 17px; color: #3B2A6B; background: var(--tint-ai); border: 1px dashed var(--lavender); border-radius: 10px; padding: 7px 10px; }
.draft b { font-weight: 600; }
.kedit { height: 76px; resize: vertical; border: 1.5px solid var(--lavender); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 18px; color: var(--ink); width: 100%; }
.kdone { background: var(--ok-bg); border: 1px solid var(--ok-line); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #14532D; animation: kin .3s; }
.kdone span { flex-grow: 1; }
.kdone .link { color: var(--ok); }
.empty { border: 1.5px dashed var(--ok-line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }

/* ---------- popup ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(30,27,46,.42); display: grid; place-items: center; padding: 16px; animation: kin .15s; }
.modal { width: min(520px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: 18px; box-shadow: 0 24px 60px rgba(30,27,46,.3); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.mhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.mhead h2 { margin: 4px 0 0; font-size: 21px; font-weight: 600; }
.mclose { width: 34px; height: 34px; border: none; border-radius: 10px; background: #F4F3F8; color: var(--ink2); font-size: 18px; cursor: pointer; flex-shrink: 0; }
.sugg { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
.sugg .who b { font-size: 14px; }
.sugg .who span { font-size: 12px; }
.field { display: flex; gap: 8px; }
.field input { flex-grow: 1; min-width: 0; height: 40px; border: 1.5px solid var(--line-mid); border-radius: 10px; padding: 0 12px; font-size: 14px; outline: none; color: var(--ink); background: var(--surface); }
.field input:focus { border-color: var(--violet-mid); }
.btn:disabled { background: #EDEBF3; color: #A9A6B8; cursor: default; border: none; }
.pill { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; border: 1px solid var(--line-mid); background: var(--surface); color: var(--violet-ink); }
.pill.on { border: none; background: var(--violet); color: #fff; }
.sect { display: flex; flex-direction: column; gap: 8px; }
.sect.top { border-top: 1px solid var(--line-soft); padding-top: 14px; }
.row-wrap { display: flex; gap: 8px; flex-wrap: wrap; }

.toast { position: fixed; z-index: 90; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--night); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13.5px; box-shadow: 0 12px 30px rgba(30,27,46,.3); max-width: calc(100% - 32px); animation: kin .2s; }

/* ---------- telefono: la barra diventa una barra di navigazione in basso ---------- */
@media (max-width: 640px) {
  .app, .app.collapsed { flex-direction: column-reverse; }
  .side, .app.collapsed .side { width: 100%; flex-direction: row; padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); gap: 2px; border-right: none; border-top: 1px solid var(--line); justify-content: space-around; }
  .side .brand, .side .nav-sep, .side .nav-toggle, .side .nav-group.secondary { display: none; }
  .side .nav-group { flex-direction: row; gap: 2px; flex: 1; justify-content: space-around; }
  .side .nav-btn { justify-content: center; padding: 0 14px; }
  .side .lbl, .side .badge.full { display: none; }
  .side .badge.mini { display: grid; }
  .main { padding-block: 20px 24px; }
  .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .prow { grid-template-columns: 40px minmax(0, 1fr); gap: 8px; }
  .hour { font-size: 12px; }
  .dash-head { flex-wrap: wrap; }
  .dash-head .eyebrow { flex: 1 1 auto; }
  .dash-head .chips { order: 3; flex-basis: 100%; }
}

/* ---------- visita dal vivo (schermo intero) ---------- */
.app.live .side { display: none; }
.main.live { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.pause-banner { background: #FFF7E6; border-bottom: 1px solid var(--warn-line); padding: 8px max(20px, env(safe-area-inset-left, 0px)); font-size: 13px; color: #8A5300; }
.lgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr) minmax(300px, 390px); gap: 18px; padding-block: 18px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.lcol { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.trbox { flex: 1; min-height: 0; background: var(--night); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; color: #fff; }
.trhead { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.trhead .lab { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--lilac); white-space: nowrap; cursor: default; user-select: none; }
.consent { font-size: 11px; padding: 3px 8px; border-radius: 999px; }
.trlines { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 48px); mask-image: linear-gradient(to bottom, transparent 0, #000 48px); }
.tl { display: flex; gap: 8px; font-size: 13px; line-height: 18px; flex-shrink: 0; opacity: .55; }
.tl.new { opacity: 1; animation: kin .4s; }
.tl b { flex-shrink: 0; width: 44px; font-weight: 600; }
.tl span { color: #D9D4F5; }
.tl.new span { color: #fff; }
.wave { display: flex; align-items: center; gap: 4px; height: 14px; }
.wave i { width: 3px; border-radius: 2px; background: #8B5CF6; transition: height .3s; }

.sheet { flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 24px rgba(76,29,149,.06); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
.sheet-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.prog .bar { width: 120px; height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--violet); border-radius: 4px; transition: width .5s; }
.miss-link { border: none; background: transparent; padding: 0; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 2px; }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup-head { display: flex; align-items: baseline; justify-content: space-between; }
.fgroup-head span:first-child { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--violet-ink); }
.fgroup-head span:last-child { font-size: 11px; color: var(--faint); }
.flist { border: 1px solid #ECE8F8; border-radius: 12px; overflow: hidden; }
.frow { display: grid; grid-template-columns: 158px minmax(0, 1fr); gap: 12px; padding: 5px 10px 5px 14px; transition: background .4s; border-top: 1px solid #F3F0FA; }
.frow:first-child { border-top: none; }
.frow.is-empty { background: #FFF6F4; }
.frow.fresh { background: var(--tint-ai); }
.frow.prop { background: #FBF9FF; }
.flabel { padding-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.flabel b { font-size: 12px; font-weight: 600; color: var(--muted); }
.frow.is-empty .flabel b { color: #C0574B; }
.fbadge { align-self: flex-start; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; }
.fta { width: 100%; resize: none; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 5px 8px; font-size: 13.5px; line-height: 19px; color: var(--ink); overflow: hidden; }
.fta:hover { border-color: var(--line); }
.fta:focus { outline: none; border-color: var(--lavender); background: #fff; }

    var ne = Math.max.apply(null, others) + 1;

      if (c.id === 'anna') { acts.push(['sgSlot', 'Proponi un appuntamento']); acts.push(['sgPerc', SG.newPerc.anna ? '✓ Percorso «Gomito» aperto' : 'Apri un nuovo percorso · Gomito']); }
      if (c.id === 'matteo') acts.push(['sgSlot', 'Proponi un appuntamento']);
      if (c.id === 'giorgio') acts.push(['soon', 'Manda l’esercizio di oggi']);
      actions = '<div class="qacts"><span class="eyebrow v">AZIONI SUGGERITE</span><div class="row-wrap">' + acts.map(function (a) { return '<button class="pill" data-a="' + a[0] + '" data-id="' + c.id + '" data-msg="Nella demo l’invio dell’esercizio non è attivo">' + a[1] + '</button>'; }).join('') + '</div></div>';
    }
    var threadHTML = '<div class="thread"><div class="thead"><div class="av" style="width:36px;height:36px;font-size:12px;' + c.av + '">' + c.ini + '</div><div class="who"><b>' + c.name + '</b><span>' + c.perc + '</span></div><span class="chip" style="border:none;' + c.intentS + '">' + c.intent + '</span></div>' +
      '<div class="msgs" id="msgs">' + c.thread.map(bubble).join('') + '</div>' +
      (c.pending ? '<div class="compose">' + actions + '<div class="draftbox"><span class="eyebrow v">' + k.dl.toUpperCase() + ' DALL’IA</span>' +
          (S.kEdit === k.id ? '<textarea class="kedit" id="kedit-' + k.id + '" data-in="ktext" data-id="' + k.id + '" aria-label="Bozza">' + esc(draftTxt) + '</textarea>' : '<div class="dtext">' + esc(draftTxt) + '</div>') +
          '<div class="btns"><button class="btn primary" data-a="sgSend" data-id="' + c.id + '">' + (k.id === 'matteo' ? 'Anticipa e invia' : 'Invia così') + '</button><button class="btn" data-a="kEdit" data-id="' + k.id + '">' + (S.kEdit === k.id ? 'Fatto' : 'Modifica') + '</button></div></div></div>'
        : '<div class="compose quiet"><span>' + (c.silent && c.grp === 'chiuso' ? 'Nessuna risposta. La SegreterIA riproverà una volta, poi si fermerà.' : 'Nessuna risposta da preparare. Se scrive, trovi qui la bozza dell’IA.') + '</span><button class="btn sm" data-a="soon" data-msg="Nella demo la scrittura libera non è attiva">Scrivi tu</button></div>') + '</div>';
    var maxT = 3;
    var ctxHTML = '<aside class="ctx"><span class="eyebrow">LA PERSONA</span><div class="ctxcard"><b>' + (c.grp === 'chiuso' ? 'Ultimo percorso' : 'Percorso in corso') + '</b><span>' + c.perc + '</span>' + (c.esito ? '<span class="ok-t">' + esc(c.esito) + '</span>' : '') + (c.last ? '<span>' + c.last + '</span>' : '') + '</div>' +
      '<div class="ctxcard"><b>Tono nel tempo</b><div class="tonebars">' + c.toneHist.map(function (v, i) { var col = v >= 3 ? '#22C55E' : v === 2 ? '#C4B5FD' : '#F59E0B'; return '<i style="height:' + (v / maxT * 100) + '%;background:' + col + '" title="Messaggio ' + (i + 1) + '"></i>'; }).join('') + '</div><span style="font-size:11.5px;color:var(--muted)">Ultimi ' + c.toneHist.length + ' messaggi · oggi: ' + TONE[c.tone][1].toLowerCase() + '</span></div>' +
      (c.strat ? '<div class="ctxcard"><b>Strategia di ricontatto</b><span>' + c.strat + '</span><span>Prossimo messaggio: <b style="font-size:12.5px">' + (SG.stop[c.id] ? 'nessuno' : SG.paused[c.id] ? 'in pausa' : c.next) + '</b></span><div class="btns"><button class="btn sm" data-a="sgPause" data-id="' + c.id + '">' + (SG.paused[c.id] ? 'Riprendi' : 'Metti in pausa') + '</button><button class="btn sm danger" data-a="sgStop" data-id="' + c.id + '">' + (SG.stop[c.id] ? 'Ricontatta di nuovo' : 'Non ricontattare più') + '</button></div></div>' : '') +
      (SG.newPerc[c.id] ? '<div class="ctxcard" style="background:var(--tint-ai)"><b>Nuovo percorso · Gomito</b><span>Aperto ora. La prima visita si collega all’appuntamento che fissi.</span></div>' : '') +
      (c.id === 'marta' ? '<button class="link" data-a="openMarta" style="align-self:flex-start">Apri la scheda di Marta →</button>' : '') + '</aside>';
    return '<div class="hours">' + ic(I.clock, 15, 2) + '<span>Orari dello studio: lun–ven 9–17. Fuori orario la SegreterIA risponde da sola alle domande pratiche; i segnali d’allarme ti arrivano sempre.</span><button class="link" data-a="nav" data-id="deleghe" title="Deleghe">Regola in Deleghe</button></div>' +
      '<div class="sgrid">' + listHTML + threadHTML + ctxHTML + '</div>';
  }
  function segRicHTML() {
    var annaBack = !!SG.sent.anna;
    var cols = [
      ['prog', 'Programmati', [['Giulia Neri', 'Ginocchio · chiuso ad agosto', 'Ogni 2 mesi', 'lun 2 nov'], ['Roberto Sala', 'Schiena · chiuso a settembre', 'Ogni mese per 3 mesi', 'mar 10 nov']].concat(P.closed ? [['Marta Rinaldi', 'Spalla · chiuso oggi', 'Ogni mese per 6 mesi', 'lun 16 nov', 'marta']] : [])],
      ['inv', 'Inviati', [['Pietro Russo', 'Gomito · chiuso a maggio', 'Nessuna risposta', '12 ott', 'pietro'], ['Carla Fontana', 'Anca · chiuso a luglio', 'In attesa', 'ieri']]],
      ['risp', 'Hanno risposto', [['Luisa Moretti', 'Caviglia · sta bene', 'Dirada: ultimo controllo a 6 mesi', 'oggi', 'luisa'], ['Davide Conti', 'Spalla · sta bene', 'Prossimo tra 2 mesi', '20 ott']]],
      ['rich', 'Da richiamare', (annaBack ? [] : [['Anna Ferri', 'Vuole tornare · gomito', 'Risposta da validare', 'ieri', 'anna']]).concat([['Sergio Villa', 'Possibile ricaduta · schiena', 'Chiedere come va', '22 ott']])],
      ['torn', 'Tornati', [['Teresa Galli', 'Nuovo percorso · collo', 'Prima visita fatta', 'set'], ['Bruno Riva', 'Ricaduta · ginocchio', 'In terapia', 'ott']].concat(annaBack ? [['Anna Ferri', 'Nuovo percorso · gomito', 'Appuntamento proposto', 'oggi', 'anna']] : [])]
    ];
    var tornati = 3 + (annaBack ? 1 : 0);
    var kpi = [['DOPO LA CHIUSURA', '23', 'pazienti seguiti dalla SegreterIA'], ['RICONTATTATI', '9', 'questo mese'], ['HANNO RISPOSTO', '68%', 'dei messaggi inviati'], ['TORNATI', String(tornati), 'per un nuovo percorso quest’anno']];
    return '<div class="kpis">' + kpi.map(function (x, i) { return '<div class="kbox' + (i === 3 ? ' hot' : '') + '"><span class="eyebrow' + (i === 3 ? ' v' : '') + '">' + x[0] + '</span><b class="big">' + x[1] + '</b><span>' + x[2] + '</span></div>'; }).join('') + '</div>' +
      '<div class="board">' + cols.map(function (col) {
        return '<div class="bcol bc-' + col[0] + '"><div class="bhead"><b>' + col[1] + '</b><span>' + col[2].length + '</span></div>' + col[2].map(function (c) {
          return '<' + (c[4] ? 'button data-a="sgOpen" data-id="' + c[4] + '"' : 'div') + ' class="bcard"><b>' + c[0] + '</b><span>' + c[1] + '</span><span class="bs">' + c[2] + '</span><span class="bd">' + c[3] + '</span></' + (c[4] ? 'button' : 'div') + '>';
        }).join('') + '</div>';
      }).join('') + '</div>';
  }
  function segreteriaHTML() {
    var pend = convs().filter(function (c) { return c.pending; }).length;
    return '<div class="wrap"><div class="ptitle"><span class="eyebrow v">SEGRETERIA</span><h1>Le conversazioni con i tuoi pazienti</h1></div>' +
      '<div class="seg" role="tablist"><button class="segb' + (SG.view === 'conv' ? ' on' : '') + '" data-a="sgView" data-v="conv">Conversazioni' + (pend ? ' · ' + pend + ' da validare' : '') + '</button><button class="segb' + (SG.view === 'ric' ? ' on' : '') + '" data-a="sgView" data-v="ric">Ricontatti dopo la chiusura</button></div>' +
      (SG.view === 'conv' ? segConvHTML() : segRicHTML()) + '</div>';
  }
  Object.assign(A, {
    sgView: function (el) { SG.view = el.dataset.v; render(); },
    sgFilter: function (el) { SG.filter = el.dataset.f; var l = convs().filter(function (c) { return convFilter(c, SG.filter); }); if (l.length && !l.some(function (c) { return c.id === SG.sel; })) SG.sel = l[0].id; render(); },
    sgSel: function (el) { SG.sel = el.dataset.id; S.kEdit = null; render(); },
    sgOpen: function (el) { SG.view = 'conv'; SG.filter = 'tutte'; SG.sel = el.dataset.id; render(); },
    sgSend: function (el) {
      var c = convs().filter(function (x) { return x.id === el.dataset.id; })[0];
      var k = K.filter(function (x) { return x.id === c.k; })[0];
      var txt = S.kText[k.id] !== undefined ? S.kText[k.id] : k.draft;
      SG.sent[c.id] = (SG.sent[c.id] || []).concat([['ia-ok', 'adesso', txt, null]]);
      S.kDone[k.id] = true; S.kEdit = null;
      render(); toast('Inviato a ' + c.name.split(' ')[0] + (c.id === 'anna' ? '. Anna passa tra i pazienti «Tornati»' : ''));
    },
    sgSlot: function (el) {
      var id = el.dataset.id, k = K.filter(function (x) { return x.id === id; })[0];
      var first = id === 'anna' ? 'Anna' : 'Matteo';
      S.kText[id] = id === 'anna' ? 'Che bello sapere della spalla, Anna! Per il gomito meglio non aspettare: ho posto ' + freeSlotsText() + ', oppure giovedì alle 18. Quale preferisci? Apriamo un nuovo percorso per il gomito.' : 'Ciao Matteo, ho visto che questa settimana è stata dura. Ho posto ' + freeSlotsText() + ': ti va di passare a fare il punto?';
      render(); toast('Ho inserito nella bozza i posti liberi del tuo planner');
    },
    sgPerc: function (el) { SG.newPerc[el.dataset.id] = true; render(); },
    sgPause: function (el) { SG.paused[el.dataset.id] = !SG.paused[el.dataset.id]; render(); },
    sgStop: function (el) { SG.stop[el.dataset.id] = !SG.stop[el.dataset.id]; render(); }
  });

  render();
})();
</script>

</body>
